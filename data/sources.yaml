# Real Old Tatar sources used by the benchmark. One entry = one source_id
# (book / manuscript / newspaper issue). Splits are assigned per source, never per page.
#
# kind: wikisource  -> page images from a Wikimedia Commons PDF/DjVu, ground truth from
#                      the Wikisource ProofreadPage transcription of the same page.
# kind: commons_image -> single image without ground truth (qualitative examples only).
# kind: commons_pages -> selected pages of a Commons scan to be annotated by humans (Phase 2);
#                        they stay split=unlabeled until verified GT exists, `planned_split`
#                        says where the source will go.
#
# family: sources sharing a series / press / scribe. A family must not span train/val/test
#         (python -m benchmark.sources validate enforces it).

sources:
  - source_id: ws_tatar_maktabe_1915
    kind: wikisource
    title: "Татар мәктәбе. 1нче китап: Рәсемле төрки әлифба (تاتار مكتبی. برنچی كتاب)"
    author: "Г. Биктави (ع. بیكتاوی)"
    publisher: "Хөсәенов көтепханәсе / типо-литография Т.Д. «А. А. Хусаинов и Ко»"
    place: Orenburg
    approx_year: 1915
    type: printed
    script_style: iske_imla_naskh
    language: tt-Arab (Old Tatar, pre-reform orthography)
    commons_file: "Татар мәктәбе - 01 - Рәсемле төрки әлифба (1915).pdf"
    wikisource_index: "Татар мәктәбе - 01 - Рәсемле төрки әлифба (1915).pdf"
    image_license: "Public domain (Wikimedia Commons)"
